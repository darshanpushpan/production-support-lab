route:
  receiver: alert-receiver
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-receiver
    webhook_configs:
      # for now this just logs alerts; later it becomes the ServiceNow bridge
      - url: http://alert-receiver:5001/alerts
        send_resolved: true
